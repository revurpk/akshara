[package]
name = "akshara-ffi"
description = "C ABI bridge between the Akshara Rust cores and the Flutter UI (JSON requests over FFI)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "akshara"
# cdylib: desktop and Android; staticlib: iOS; rlib: Rust tests.
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
office-odf.workspace = true
office-writer.workspace = true
office-calc.workspace = true
office-math.workspace = true
office-indic.workspace = true
serde_json.workspace = true
serde.workspace = true

# This crate needs `unsafe` for the C ABI boundary only; it is denied
# everywhere else and allowed item by item in src/lib.rs.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
