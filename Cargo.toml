[workspace]
resolver = "2"
members = ["crates/odf", "crates/math", "crates/calc", "crates/writer", "crates/draw", "crates/voice", "crates/ai", "crates/ffi", "crates/indic", "tools/icongen", "tools/fatlib"]
# Vendored third-party code keeps its own manifest and lints.
exclude = ["third_party/teltools"]
default-members = ["crates/odf", "crates/math", "crates/calc", "crates/writer", "crates/draw", "crates/voice", "crates/ai", "crates/ffi", "crates/indic"]

[workspace.package]
version = "0.3.4"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
office-odf = { path = "crates/odf" }
office-writer = { path = "crates/writer" }
office-draw = { path = "crates/draw" }
office-calc = { path = "crates/calc" }
office-math = { path = "crates/math" }
office-indic = { path = "crates/indic" }
office-voice = { path = "crates/voice" }
office-ai = { path = "crates/ai" }
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
proptest = "1"
# Already used through zip / icongen: no new downloads for the PDF writer.
png = "0.18"
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"

# The speech engine is unusably slow unoptimised; optimise it (and its
# numeric dependencies) in debug builds too.
[profile.dev.package.office-voice]
opt-level = 3
[profile.dev.package.candle-core]
opt-level = 3
[profile.dev.package.gemm]
opt-level = 3
[profile.dev.package.gemm-common]
opt-level = 3
[profile.dev.package.gemm-f32]
opt-level = 3
[profile.dev.package.gemm-f16]
opt-level = 3
[profile.dev.package.half]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
panic = "unwind"
overflow-checks = true
strip = "debuginfo"
